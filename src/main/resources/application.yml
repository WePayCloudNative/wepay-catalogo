server:
    port: ${SERVER_PORT:8084}
spring:
    application:
        name: ms-catalogo
    datasource:
        url: jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password:
    sql:
        init:
            mode: always
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: update
        defer-datasource-initialization: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
    h2:
        console:
            enabled: true

